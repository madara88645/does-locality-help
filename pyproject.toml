[project]
name = "forgetlab"
version = "0.1.0"
description = "From-scratch contrastive Hebbian learning and predictive coding in PyTorch, validated against their published equivalence theorems, used to compare forgetting against backprop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.13",
    "torchvision>=0.28",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgetlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
